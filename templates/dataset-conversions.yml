spec:
  inputs:
    stage:
      default: test
      description: "Pipeline stage for the dataset conversion scrape job."
    job-name:
      default: dataset-conversions
      description: "Job name to use after the component merges into the consuming pipeline."
    dataset_id:
      default: ""
      description: "Optional org dataset UUID to scrape. Empty scrapes every org dataset."
    output_dir:
      default: "."
      description: "Directory where conversion outputs are written."
    host:
      default: ""
      description: "Optional Zoo API host. Empty means use the SDK default or existing ZOO_HOST."
    artifacts_image:
      default: python:3.12-slim
      description: "Container image for the dataset conversion scrape job. Override with a Python 3.12 compatible mirror if your runners cannot pull Docker Hub images."
---
"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.artifacts_image ]]
  before_script:
    - mkdir -p .gitlab-kcl-actions
    - |
      cat > .gitlab-kcl-actions/dataset_conversions.py <<'KCL_ARTIFACTS_DATASET_CONVERSIONS_PY'
      #!/usr/bin/env python3
      """Download successful org dataset conversion outputs with the KittyCAD Python SDK."""

      from __future__ import annotations

      import argparse
      import os
      import re
      import sys
      from dataclasses import dataclass, field
      from pathlib import Path, PurePosixPath
      from typing import Any, NoReturn

      LOG_PREFIX = "[dataset-conversions]"
      SAFE_PATH_PART_RE = re.compile(r"[^A-Za-z0-9._ -]+")
      SAFE_PATH_SEPARATORS_RE = re.compile(r"_+")
      DEFAULT_FILTER = "status=success"


      @dataclass
      class ScrapeStats:
          dataset_id: str
          dataset_name: str
          output_dir: Path
          seen: int = 0
          completed: int = 0
          skipped_phase: int = 0
          fetched: int = 0
          outputs_written: int = 0
          snapshots_written: int = 0
          conversions: list[dict[str, Any]] = field(default_factory=list)


      def log(message: str) -> None:
          print(f"{LOG_PREFIX} {message}", file=sys.stderr, flush=True)


      def fail(message: str) -> NoReturn:
          raise SystemExit(f"error: {message}")


      def enum_value(value: Any) -> str:
          return str(getattr(value, "value", value))


      def safe_path_part(value: str, *, fallback: str) -> str:
          part = SAFE_PATH_PART_RE.sub("_", value.strip())
          part = SAFE_PATH_SEPARATORS_RE.sub("_", part)
          return part.strip(" ._-") or fallback


      def safe_relative_path(value: str) -> Path:
          normalized = value.replace("\\", "/")
          path = PurePosixPath(normalized)
          if path.is_absolute():
              fail(f"conversion file path must be relative, got: {value!r}")

          parts: list[str] = []
          for part in path.parts:
              if part in ("", "."):
                  continue
              if part == "..":
                  fail(f"conversion file path cannot traverse directories, got: {value!r}")
              parts.append(safe_path_part(part, fallback="unnamed"))

          if not parts:
              fail("conversion file path cannot be empty")
          return Path(*parts)


      def ensure_png_bytes(image: Any, *, conversion_id: str, group: str, index: int) -> bytes:
          mime_type = getattr(image, "mime_type", None)
          if mime_type != "image/png":
              fail(
                  f"conversion {conversion_id} {group} snapshot {index} has unsupported "
                  f"mime type {mime_type!r}; expected image/png"
              )

          data = getattr(image, "data_base64", None)
          if not isinstance(data, (bytes, bytearray, memoryview)):
              fail(
                  f"conversion {conversion_id} {group} snapshot {index} did not contain SDK-decoded bytes"
              )
          return bytes(data)


      def write_text_artifact(path: Path, value: str | None) -> bool:
          if value is None:
              return False
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(value, encoding="utf-8")
          return True


      def write_salon_snapshots(
          conversion_dir: Path,
          conversion_id: str,
          images: list[Any],
      ) -> list[str]:
          written: list[str] = []
          for index, image in enumerate(images):
              data = ensure_png_bytes(
                  image,
                  conversion_id=conversion_id,
                  group="salon-kcl",
                  index=index,
              )
              path = conversion_dir / f"{index}.png"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              written.append(path.name)
          return written


      def write_conversion_readme(
          conversion_dir: Path,
          *,
          conversion_id: str,
          file_path: str,
          wrote_output: bool,
          snapshot_names: list[str],
      ) -> None:
          lines = [
              f"# {file_path}",
              "",
              f"- Conversion ID: `{conversion_id}`",
          ]
          if wrote_output:
              lines.append("- KCL output: [main.kcl](main.kcl)")

          lines.extend(["", "## Snapshots", ""])
          if snapshot_names:
              for index, snapshot_name in enumerate(snapshot_names):
                  lines.extend(
                      [
                          f"### Snapshot {index}",
                          "",
                          f"![Snapshot {index}]({snapshot_name})",
                          "",
                      ]
                  )
          else:
              lines.append("No salon snapshot images were returned.")

          conversion_dir.mkdir(parents=True, exist_ok=True)
          (conversion_dir / "README.md").write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")


      def write_conversion_artifacts(
          output_dir: Path,
          dataset_dir_name: str,
          summary: Any,
          details: Any,
      ) -> dict[str, Any]:
          conversion_id = str(summary.id)
          file_path = str(summary.file_path)
          conversion_dir = output_dir / dataset_dir_name / "output" / safe_relative_path(file_path)

          output_paths: list[str] = []
          path = conversion_dir / "main.kcl"
          wrote_output = write_text_artifact(path, getattr(details, "output", None))
          if wrote_output:
              output_paths.append(path.relative_to(output_dir).as_posix())

          snapshot_names = write_salon_snapshots(
              conversion_dir,
              conversion_id,
              list(getattr(details, "salon_kcl_snapshot_images", []) or []),
          )
          write_conversion_readme(
              conversion_dir,
              conversion_id=conversion_id,
              file_path=file_path,
              wrote_output=wrote_output,
              snapshot_names=snapshot_names,
          )

          return {
              "id": conversion_id,
              "file_path": file_path,
              "phase": enum_value(getattr(summary, "phase", "")),
              "status": enum_value(getattr(summary, "status", "")),
              "output_paths": output_paths,
              "snapshot_count": len(snapshot_names),
              "artifact_dir": conversion_dir.relative_to(output_dir).as_posix(),
          }


      def scrape_dataset_conversions(
          client: Any,
          *,
          dataset_id: str,
          output_dir: Path,
          dataset: Any | None = None,
      ) -> ScrapeStats:
          if dataset is None:
              dataset = client.orgs.get_org_dataset(dataset_id)
          dataset_name = str(dataset.name)
          dataset_dir_name = safe_path_part(dataset_name, fallback=dataset_id)
          stats = ScrapeStats(
              dataset_id=dataset_id,
              dataset_name=dataset_name,
              output_dir=output_dir,
          )
          log(
              "scraping dataset conversions: "
              f"dataset_id={dataset_id} dataset_name={dataset_name!r} "
              f"filter={DEFAULT_FILTER!r} output_dir={output_dir}"
          )

          conversions = client.orgs.list_org_dataset_conversions(
              dataset_id,
              filter=DEFAULT_FILTER,
          )
          for summary in conversions:
              stats.seen += 1
              conversion_id = str(summary.id)
              phase = enum_value(getattr(summary, "phase", ""))
              status = enum_value(getattr(summary, "status", ""))
              file_path = str(summary.file_path)
              log(
                  "conversion summary: "
                  f"id={conversion_id} phase={phase} status={status} file_path={file_path!r}"
              )
              if phase != "completed":
                  stats.skipped_phase += 1
                  log(f"skipping conversion {conversion_id}: phase={phase}")
                  continue

              stats.completed += 1
              details = client.orgs.get_org_dataset_conversion(dataset_id, conversion_id)
              stats.fetched += 1
              record = write_conversion_artifacts(
                  output_dir,
                  dataset_dir_name,
                  summary,
                  details,
              )
              stats.outputs_written += len(record["output_paths"])
              stats.snapshots_written += int(record["snapshot_count"])
              stats.conversions.append(record)
              log(
                  "conversion written: "
                  f"id={conversion_id} outputs={len(record['output_paths'])} "
                  f"snapshots={record['snapshot_count']} dir={record['artifact_dir']}"
              )

          return stats


      def selected_datasets(client: Any, dataset_id: str | None) -> list[Any]:
          if dataset_id:
              return [client.orgs.get_org_dataset(dataset_id)]
          return list(client.orgs.list_org_datasets())


      def scrape_datasets_conversions(
          client: Any,
          *,
          dataset_id: str | None,
          output_dir: Path,
      ) -> list[ScrapeStats]:
          datasets = selected_datasets(client, dataset_id)
          log(f"selected {len(datasets)} dataset(s)")
          stats: list[ScrapeStats] = []
          for dataset in datasets:
              current_dataset_id = str(dataset.id)
              stats.append(
                  scrape_dataset_conversions(
                      client,
                      dataset_id=current_dataset_id,
                      output_dir=output_dir,
                      dataset=dataset,
                  )
              )
          return stats


      def total_count(stats: list[ScrapeStats], attr: str) -> int:
          return sum(int(getattr(item, attr)) for item in stats)


      def build_client(*, token: str | None, host: str | None) -> Any:
          try:
              from kittycad import KittyCAD
          except ImportError:
              fail("install the kittycad Python SDK before running this script")

          kwargs: dict[str, Any] = {}
          if host:
              kwargs["base_url"] = host
          if token:
              return KittyCAD(token=token, **kwargs)
          return KittyCAD(**kwargs)


      def env_first(*names: str) -> str | None:
          for name in names:
              value = os.getenv(name)
              if value:
                  return value
          return None


      def build_parser() -> argparse.ArgumentParser:
          parser = argparse.ArgumentParser(description=__doc__)
          parser.add_argument(
              "--dataset-id",
              default=env_first("DATASET_ID", "ORG_DATASET_ID"),
              help=(
                  "Optional org dataset UUID to narrow the scrape. If omitted, every org "
                  "dataset is scraped. Defaults to DATASET_ID, then ORG_DATASET_ID."
              ),
          )
          parser.add_argument(
              "--output-dir",
              type=Path,
              default=Path("."),
              help="Directory where conversion outputs should be written.",
          )
          parser.add_argument(
              "--host",
              help=(
                  "Optional API host. If unset, the KittyCAD SDK uses its default host "
                  "or the standard ZOO_HOST environment variable."
              ),
          )
          return parser


      def main() -> int:
          args = build_parser().parse_args()

          token = env_first("KITTYCAD_API_TOKEN", "ZOO_API_TOKEN")
          client = build_client(token=token, host=args.host)
          try:
              stats = scrape_datasets_conversions(
                  client,
                  dataset_id=args.dataset_id or None,
                  output_dir=args.output_dir,
              )
          finally:
              close = getattr(client, "close", None)
              if callable(close):
                  close()

          print(
              "downloaded "
              f"{total_count(stats, 'fetched')} completed conversion(s) "
              f"from {len(stats)} dataset(s), "
              f"wrote {total_count(stats, 'outputs_written')} KCL output file(s) and "
              f"{total_count(stats, 'snapshots_written')} snapshot(s)"
          )
          return 0


      if __name__ == "__main__":
          try:
              raise SystemExit(main())
          except KeyboardInterrupt:
              print("interrupted", file=sys.stderr)
              raise SystemExit(130) from None
      KCL_ARTIFACTS_DATASET_CONVERSIONS_PY
  script:
    - python -m pip install --no-cache-dir kittycad
    - |
      component_host="$[[ inputs.host ]]"
      if [ -n "$component_host" ]; then
        export ZOO_HOST="$component_host"
      fi
      set --
      dataset_id="$[[ inputs.dataset_id ]]"
      if [ -n "$dataset_id" ]; then
        set -- "$@" --dataset-id "$dataset_id"
      fi
      output_dir="$[[ inputs.output_dir ]]"
      if [ -n "$output_dir" ]; then
        set -- "$@" --output-dir "$output_dir"
      fi
      python .gitlab-kcl-actions/dataset_conversions.py "$@"
  artifacts:
    when: always
    paths:
      - $[[ inputs.output_dir ]]/
