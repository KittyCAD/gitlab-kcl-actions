spec:
  inputs:
    stage:
      default: test
      description: "Pipeline stage for both KCL artifact jobs."
    job-name:
      default: kcl-artifacts
      description: "Job name to use after the component merges into the consuming pipeline."
    parameters_json:
      default: "{}"
      description: "JSON object of values to replace in sibling parameters.kcl files before running Zoo."
    main_kcl_paths:
      default: "[]"
      description: "Optional bare path, JSON string, or JSON array of KCL entrypoint paths. Empty processes changed assemblies only."
    entrypoint:
      default: main.kcl
      description: "KCL entrypoint filename or repo-relative path to discover when main_kcl_paths is empty."
    parameters_filename:
      default: parameters.kcl
      description: "Sibling KCL parameters filename. The default also tries entrypoint-stem variants for non-main entrypoints."
    metadata_path:
      default: metadata.json
      description: "Metadata JSON filename, default entrypoint-stem variants, or one repo-relative metadata JSON path."
    host:
      default: ""
      description: "Optional Zoo API host. Empty means do not pass --host to the Zoo CLI."
    zoo_version:
      default: ""
      description: "Optional Zoo CLI release, like v0.2.165. Empty installs the latest release."
    install_image:
      default: debian:bookworm-slim
      description: "Container image for the Zoo CLI install job. Override with a Debian-compatible mirror if your runners cannot pull Docker Hub images."
    artifacts_image:
      default: python:3.12-slim
      description: "Container image for the KCL artifact job. Override with a Python 3.12 Debian-compatible mirror if your runners cannot pull Docker Hub images."
    snapshot_angle:
      default: four-ways
      options:
        - front
        - top
        - right-side
        - four-ways
        - iso
      description: "Camera angle used for the assembly-level entrypoint snapshot preview."
    snapshot_views:
      default: iso,front,top,right-side
      description: "Comma-separated camera angles used for per-file snapshot view PNGs."
    camera_style:
      default: ortho
      options:
        - ortho
        - perspective
      description: "Camera style used for snapshots."
    camera_padding:
      default: "0.1"
      description: "Camera padding passed to zoo kcl snapshot."
    parallelism:
      default: "6"
      description: "Maximum number of concurrent Zoo CLI artifact commands."
    zoo_attempts:
      default: "4"
      description: "Maximum attempts for each Zoo CLI artifact command."
    zoo_retry_delay:
      default: "10"
      description: "Seconds to wait between failed Zoo CLI artifact command attempts."
---
"$[[ inputs.job-name ]]-install-zoo-cli":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.install_image ]]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl coreutils
    - rm -rf /var/lib/apt/lists/*
    - mkdir -p .gitlab-kcl-actions .kcl-tools/bin
    - |
      cat > .gitlab-kcl-actions/install-zoo-cli.sh <<'KCL_ARTIFACTS_INSTALL_ZOO_CLI_SH'
      #!/usr/bin/env bash
      set -Eeuox pipefail

      self="$(basename "$0")"
      usage() {
        cat <<-EOUSAGE
      		usage: $self [zoo-version] [install-dir]

      		Installs the Zoo CLI release binary for this Linux runner.
      		If zoo-version is empty, installs the latest release.
      	EOUSAGE
      }

      if [ "$#" -gt 2 ]; then
        usage >&2
        exit 1
      fi

      requested_version="${1:-}"
      install_dir="${2:-/usr/local/bin}"

      case "$(uname -s)" in
        Linux)
          os="unknown-linux-musl"
          ;;
        *)
          echo "error: this installer currently supports Linux runners only" >&2
          exit 1
          ;;
      esac

      case "$(uname -m)" in
        x86_64 | amd64)
          arch="x86_64"
          ;;
        aarch64 | arm64)
          arch="aarch64"
          ;;
        *)
          echo "error: unsupported architecture: $(uname -m)" >&2
          exit 1
          ;;
      esac

      if [ -z "$requested_version" ]; then
        release="$(
          curl -fsSI --connect-timeout 20 --max-time 120 --retry 3 --retry-delay 2 \
            "https://github.com/KittyCAD/cli/releases/latest" |
            tr -d '\r' |
            sed -n 's|^[Ll]ocation: .*/tag/\([^/?#[:space:]]*\).*|\1|p' |
            head -n 1
        )"
      else
        release="$requested_version"
        if [[ "$release" != v* ]]; then
          release="v$release"
        fi
      fi
      if [ -z "$release" ] || [ "$release" = 'null' ]; then
        echo "error: failed to resolve Zoo CLI release" >&2
        exit 1
      fi

      asset="zoo-${arch}-${os}"
      base_url="https://dl.zoo.dev/releases/cli/${release}"
      mkdir -p "$install_dir"

      echo "Installing Zoo CLI ${release} (${asset})"
      expected_sha="$(
        curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 --retry-delay 2 \
          "${base_url}/${asset}.sha256" |
          cut -d ' ' -f 1
      )"
      if [ -z "$expected_sha" ]; then
        echo "error: failed to resolve SHA256 for ${asset} in ${release}" >&2
        exit 1
      fi

      tmp="$(mktemp "${install_dir}/.zoo.XXXXXXXXXX")"
      trap 'rm -f "$tmp"' EXIT

      curl -fsSL --connect-timeout 20 --max-time 300 --retry 3 --retry-delay 2 \
        "${base_url}/${asset}" \
        -o "$tmp"
      echo "${expected_sha}  ${tmp}" | sha256sum -c -
      chmod a+x "$tmp"
      mv -f "$tmp" "${install_dir}/zoo"
      trap - EXIT

      "${install_dir}/zoo" version
      KCL_ARTIFACTS_INSTALL_ZOO_CLI_SH
    - chmod +x .gitlab-kcl-actions/install-zoo-cli.sh
  script:
    - .gitlab-kcl-actions/install-zoo-cli.sh '$[[ inputs.zoo_version ]]' "$CI_PROJECT_DIR/.kcl-tools/bin"
  artifacts:
    paths:
      - .kcl-tools/bin/zoo

"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.artifacts_image ]]
  needs:
    - job: "$[[ inputs.job-name ]]-install-zoo-cli"
      artifacts: true
  variables:
    KCL_PARAMETERS_JSON: |-
      $[[ inputs.parameters_json ]]
    KCL_MAIN_KCL_PATHS: |-
      $[[ inputs.main_kcl_paths ]]
    KCL_ENTRYPOINT: '$[[ inputs.entrypoint ]]'
    KCL_PARAMETERS_FILENAME: '$[[ inputs.parameters_filename ]]'
    KCL_METADATA_PATH: '$[[ inputs.metadata_path ]]'
    KCL_ZOO_HOST: '$[[ inputs.host ]]'
    KCL_SNAPSHOT_ANGLE: '$[[ inputs.snapshot_angle ]]'
    KCL_SNAPSHOT_VIEWS: '$[[ inputs.snapshot_views ]]'
    KCL_CAMERA_STYLE: '$[[ inputs.camera_style ]]'
    KCL_CAMERA_PADDING: '$[[ inputs.camera_padding ]]'
    KCL_ZOO_PARALLELISM: '$[[ inputs.parallelism ]]'
    KCL_ZOO_ATTEMPTS: '$[[ inputs.zoo_attempts ]]'
    KCL_ZOO_RETRY_DELAY: '$[[ inputs.zoo_retry_delay ]]'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates tar coreutils findutils git
    - rm -rf /var/lib/apt/lists/*
    - mkdir -p .gitlab-kcl-actions .kcl-tools/bin
    - |
      cat > .gitlab-kcl-actions/kcl_artifacts.py <<'KCL_ARTIFACTS_KCL_ARTIFACTS_PY'
      #!/usr/bin/env python3
      """Helpers for the GitLab KCL artifact workflow."""

      from __future__ import annotations

      import argparse
      import json
      import math
      import os
      import re
      import shlex
      import shutil
      import sys
      from dataclasses import dataclass
      from pathlib import Path, PurePosixPath
      from typing import Any, NoReturn

      REQUIRED_METADATA = {
          "material_density": (int, float),
          "material_density_unit": str,
          "mass_output_unit": str,
          "volume_output_unit": str,
          "density_output_unit": str,
          "surface_area_output_unit": str,
          "center_of_mass_output_unit": str,
          "bounding_box_output_unit": str,
      }

      ENV_NAMES = {
          "material_density": "MATERIAL_DENSITY",
          "material_density_unit": "MATERIAL_DENSITY_UNIT",
          "mass_output_unit": "MASS_OUTPUT_UNIT",
          "volume_output_unit": "VOLUME_OUTPUT_UNIT",
          "density_output_unit": "DENSITY_OUTPUT_UNIT",
          "surface_area_output_unit": "SURFACE_AREA_OUTPUT_UNIT",
          "center_of_mass_output_unit": "CENTER_OF_MASS_OUTPUT_UNIT",
          "bounding_box_output_unit": "BOUNDING_BOX_OUTPUT_UNIT",
      }

      DEFAULT_ENTRYPOINT = "main.kcl"
      DEFAULT_PARAMETERS_FILENAME = "parameters.kcl"
      DEFAULT_METADATA_PATH = "metadata.json"
      MISSING_ASSEMBLY_FIELD = "-"

      ASSIGNMENT_RE = re.compile(
          r"^(?P<prefix>export\s+)(?P<name>[A-Za-z_][A-Za-z0-9_]*)(?P<equals>\s*=\s*)"
          r"(?P<value>.*?)(?P<comment>\s*(?://.*)?)$"
      )
      SKIPPED_DIRS = {
          ".git",
          ".gitlab-kcl-actions",
          ".kcl-tools",
          "kcl-artifacts",
          "node_modules",
          "target",
      }


      class WorkflowError(Exception):
          """A user-facing workflow error."""


      @dataclass(frozen=True)
      class Assembly:
          id: str
          main_kcl: str
          parameters_kcl: str | None
          metadata_json: str | None


      def fail(message: str) -> NoReturn:
          raise WorkflowError(message)


      def warn(message: str) -> None:
          print(f"warning: {message}", file=sys.stderr)


      def assembly_file_field(path: str | None) -> str:
          return path if path is not None else MISSING_ASSEMBLY_FIELD


      def optional_assembly_file_field(raw_path: str) -> str | None:
          if raw_path in {"", MISSING_ASSEMBLY_FIELD}:
              return None
          return raw_path


      def load_json_object(raw: str, description: str) -> dict[str, Any]:
          text = raw.strip()
          if not text:
              return {}
          try:
              value = json.loads(text)
          except json.JSONDecodeError as err:
              fail(f"{description} is not valid JSON: {err}")
          if not isinstance(value, dict):
              fail(f"{description} must be a JSON object")
          return value


      def load_entrypoint_paths(raw: str, description: str) -> list[str]:
          text = raw.strip()
          if not text:
              return []
          try:
              value = json.loads(text)
          except json.JSONDecodeError:
              values = [text]
          else:
              if isinstance(value, str):
                  values = [value]
              elif isinstance(value, list) and all(isinstance(item, str) for item in value):
                  values = value
              else:
                  fail(
                      f"{description} must be a relative .kcl entrypoint path, JSON string, "
                      "or JSON array of strings"
                  )

          output: list[str] = []
          seen: set[str] = set()
          for item in values:
              path = normalize_entrypoint_path(item, "entrypoint")
              if path in seen:
                  fail(f"{description} contains duplicate path: {path}")
              seen.add(path)
              output.append(path)
          return output


      def normalize_entrypoint_path(raw_path: str, description: str) -> str:
          path = PurePosixPath(raw_path)
          if raw_path == "" or path.is_absolute():
              fail(f"{description} path must be relative: {raw_path!r}")
          if any(part in {"", ".", ".."} for part in path.parts):
              fail(f"{description} path must not contain empty, '.', or '..' parts: {raw_path!r}")
          if path.suffix != ".kcl":
              fail(f"{description} path must point to a .kcl file: {raw_path!r}")
          return path.as_posix()


      def normalize_parameters_filename(raw_filename: str) -> str:
          path = PurePosixPath(raw_filename)
          if raw_filename == "" or path.is_absolute() or len(path.parts) != 1:
              fail(f"parameters_filename must be a relative .kcl filename: {raw_filename!r}")
          if any(part in {"", ".", ".."} for part in path.parts):
              fail(f"parameters_filename must not contain empty, '.', or '..' parts: {raw_filename!r}")
          if path.suffix != ".kcl":
              fail(f"parameters_filename must point to a .kcl file: {raw_filename!r}")
          return path.as_posix()


      def normalize_metadata_path(raw_path: str) -> str:
          path = PurePosixPath(raw_path)
          if raw_path == "" or path.is_absolute():
              fail(f"metadata_path must be relative: {raw_path!r}")
          if any(part in {"", ".", ".."} for part in path.parts):
              fail(f"metadata_path must not contain empty, '.', or '..' parts: {raw_path!r}")
          if path.suffix != ".json":
              fail(f"metadata_path must point to a .json file: {raw_path!r}")
          return path.as_posix()


      def unique_paths(paths: list[Path]) -> list[Path]:
          output: list[Path] = []
          seen: set[Path] = set()
          for path in paths:
              if path in seen:
                  continue
              seen.add(path)
              output.append(path)
          return output


      def default_sibling_candidates(main_kcl: Path, raw_filename: str) -> list[Path]:
          candidates = [main_kcl.parent / raw_filename]
          if main_kcl.name != DEFAULT_ENTRYPOINT:
              candidates.extend(
                  [
                      main_kcl.parent / f"{main_kcl.stem}-{raw_filename}",
                      main_kcl.parent / f"{main_kcl.stem}_{raw_filename}",
                  ]
              )
          return unique_paths(candidates)


      def first_existing_file(candidates: list[Path]) -> Path | None:
          for candidate in candidates:
              if candidate.is_file():
                  return candidate
          return None


      def candidate_list_message(candidates: list[Path], repo_root: Path) -> str:
          return ", ".join(relative_posix(candidate, repo_root) for candidate in candidates)


      def parameters_file_for_entrypoint(
          repo_root: Path,
          main_kcl: Path,
          parameters_filename: str,
      ) -> Path | None:
          if parameters_filename == DEFAULT_PARAMETERS_FILENAME:
              candidates = default_sibling_candidates(main_kcl, parameters_filename)
          else:
              candidates = [main_kcl.parent / parameters_filename]

          parameters_file = first_existing_file(candidates)
          if parameters_file is None:
              warn(
                  f"parameters file was not found for "
                  f"{relative_posix(main_kcl, repo_root)}; tried "
                  f"{candidate_list_message(candidates, repo_root)}; "
                  "parameter overrides will be skipped for this assembly"
              )
          return parameters_file


      def metadata_file_for_entrypoint(
          repo_root: Path,
          main_kcl: Path,
          metadata_path: str,
      ) -> Path | None:
          path = PurePosixPath(metadata_path)
          if len(path.parts) > 1:
              metadata_file = repo_root / path.as_posix()
              if metadata_file.is_file():
                  return metadata_file
              warn(f"metadata file {metadata_path!r} was not found; physics artifacts will be skipped")
              return None

          if metadata_path == DEFAULT_METADATA_PATH:
              candidates = default_sibling_candidates(main_kcl, metadata_path)
          else:
              candidates = [main_kcl.parent / metadata_path]

          metadata_file = first_existing_file(candidates)
          if metadata_file is None:
              warn(
                  f"metadata file was not found for "
                  f"{relative_posix(main_kcl, repo_root)}; tried "
                  f"{candidate_list_message(candidates, repo_root)}; "
                  "physics artifacts will be skipped for this assembly"
              )
          return metadata_file


      def parameter_paths_for_assemblies(assemblies: list[Assembly], repo_root: Path) -> set[Path]:
          return {
              repo_root / assembly.parameters_kcl
              for assembly in assemblies
              if assembly.parameters_kcl is not None
          }


      def normalize_repo_path(raw_path: str, description: str) -> str:
          path = PurePosixPath(raw_path)
          if raw_path == "" or path.is_absolute():
              fail(f"{description} path must be relative: {raw_path!r}")
          if any(part in {"", ".", ".."} for part in path.parts):
              fail(f"{description} path must not contain empty, '.', or '..' parts: {raw_path!r}")
          return path.as_posix()


      def kcl_literal(value: Any) -> str:
          if value is None:
              return "none"
          if isinstance(value, bool):
              return "true" if value else "false"
          if isinstance(value, int):
              return str(value)
          if isinstance(value, float):
              if not math.isfinite(value):
                  fail("JSON numbers must be finite")
              return repr(value)
          if isinstance(value, str):
              return json.dumps(value)
          if isinstance(value, list):
              return "[" + ", ".join(kcl_literal(item) for item in value) + "]"
          if isinstance(value, dict):
              fields: list[str] = []
              for key, item in value.items():
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                      fail(f"object key {key!r} is not a valid KCL identifier")
                  fields.append(f"{key} = {kcl_literal(item)}")
              return "{ " + ", ".join(fields) + " }"
          fail(f"unsupported JSON value type: {type(value).__name__}")


      def apply_parameter_values(parameters_file: Path, overrides: dict[str, Any]) -> None:
          if not parameters_file.is_file():
              fail(f"required parameters file does not exist: {parameters_file}")

          if not overrides:
              return

          lines = parameters_file.read_text(encoding="utf-8").splitlines(keepends=True)
          replacement_names = set(overrides)
          seen: set[str] = set()
          output: list[str] = []

          for line in lines:
              newline = ""
              body = line
              if body.endswith("\n"):
                  newline = "\n"
                  body = body[:-1]

              match = ASSIGNMENT_RE.match(body)
              if not match:
                  output.append(line)
                  continue

              name = match.group("name")
              if name not in overrides:
                  output.append(line)
                  continue
              if name in seen:
                  fail(f"parameters file defines {name!r} more than once")

              seen.add(name)
              output.append(
                  f"{match.group('prefix')}{name}{match.group('equals')}"
                  f"{kcl_literal(overrides[name])}{match.group('comment')}{newline}"
              )

          missing = sorted(replacement_names - seen)
          if missing:
              fail(
                  "parameters_json referenced parameter(s) not exported in parameters file: "
                  + ", ".join(missing)
              )

          parameters_file.write_text("".join(output), encoding="utf-8")


      def apply_parameters(parameters_file: Path, overrides_json: str) -> None:
          overrides = load_json_object(overrides_json, "parameters_json")
          apply_parameter_values(parameters_file, overrides)


      def exported_parameter_names(parameters_file: Path) -> set[str]:
          if not parameters_file.is_file():
              fail(f"required parameters file does not exist: {parameters_file}")

          names: set[str] = set()
          lines = parameters_file.read_text(encoding="utf-8").splitlines()
          for line in lines:
              match = ASSIGNMENT_RE.match(line)
              if match:
                  names.add(match.group("name"))
          return names


      def walk_kcl_files(repo_root: Path) -> list[Path]:
          files: list[Path] = []
          for root, dirs, filenames in os.walk(repo_root):
              dirs[:] = sorted(d for d in dirs if d not in SKIPPED_DIRS)
              for filename in sorted(filenames):
                  if filename.endswith(".kcl"):
                      files.append(Path(root, filename))
          return files


      def relative_posix(path: Path, root: Path) -> str:
          return path.relative_to(root).as_posix()


      def find_named_files(repo_root: Path, filename: str) -> list[Path]:
          return [path for path in walk_kcl_files(repo_root) if path.name == filename]


      def find_entrypoint_files(repo_root: Path, entrypoint: str) -> list[Path]:
          entrypoint_path = PurePosixPath(entrypoint)
          if len(entrypoint_path.parts) == 1:
              return find_named_files(repo_root, entrypoint)

          path = repo_root / entrypoint_path.as_posix()
          return [path] if path.is_file() else []


      def assembly_id_for_main(main_kcl: Path, repo_root: Path) -> str:
          relative_dir = main_kcl.parent.relative_to(repo_root).as_posix()
          return "root" if relative_dir == "." else relative_dir


      def contains_path(parent: Path, child: Path) -> bool:
          try:
              child.relative_to(parent)
          except ValueError:
              return False
          return True


      def owning_assembly_dir(path: Path, assembly_dirs: set[Path]) -> Path | None:
          matches = [assembly_dir for assembly_dir in assembly_dirs if contains_path(assembly_dir, path)]
          if not matches:
              return None
          return max(matches, key=lambda item: len(item.parts))


      def load_changed_paths(changed_files_file: Path | None) -> list[str]:
          if changed_files_file is None:
              return []
          if not changed_files_file.is_file():
              fail(f"changed files list does not exist: {changed_files_file}")

          output: list[str] = []
          seen: set[str] = set()
          for line in changed_files_file.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              path = normalize_repo_path(line, "changed file")
              if PurePosixPath(path).parts[0] in SKIPPED_DIRS:
                  continue
              if path not in seen:
                  seen.add(path)
                  output.append(path)
          return output


      def main_files_for_changed_paths(
          repo_root: Path,
          all_main_files: list[Path],
          changed_paths: list[str],
          shared_dependency_paths: set[str],
      ) -> list[Path]:
          assembly_dirs = {path.parent for path in all_main_files}
          selected_dirs: set[Path] = set()
          selected_all = False
          for relative_path in changed_paths:
              if relative_path in shared_dependency_paths:
                  selected_all = True
                  continue
              owner = owning_assembly_dir(repo_root / relative_path, assembly_dirs)
              if owner is not None:
                  selected_dirs.add(owner)
          if selected_all:
              return all_main_files
          return [main_kcl for main_kcl in all_main_files if main_kcl.parent in selected_dirs]


      def snapshot_files_for_assemblies(
          repo_root: Path,
          selected_main_files: list[Path],
          all_main_files: list[Path],
          limit_to_selected: bool,
          parameter_paths: set[Path],
      ) -> list[Path]:
          snapshot_files = [path for path in walk_kcl_files(repo_root) if path not in parameter_paths]
          if not limit_to_selected:
              return snapshot_files

          selected_dirs = {path.parent for path in selected_main_files}
          assembly_dirs = {path.parent for path in all_main_files}
          return [
              path for path in snapshot_files if owning_assembly_dir(path, assembly_dirs) in selected_dirs
          ]


      def write_project_info(
          repo_root: Path,
          assemblies_out: Path,
          snapshots_out: Path,
          main_kcl_paths_json: str = "[]",
          changed_files_file: Path | None = None,
          entrypoint: str = DEFAULT_ENTRYPOINT,
          parameters_filename: str = DEFAULT_PARAMETERS_FILENAME,
          metadata_path: str = DEFAULT_METADATA_PATH,
      ) -> None:
          repo_root = repo_root.resolve()
          entrypoint = normalize_entrypoint_path(entrypoint, "entrypoint")
          parameters_filename = normalize_parameters_filename(parameters_filename)
          metadata_path = normalize_metadata_path(metadata_path)
          selected_paths = load_entrypoint_paths(main_kcl_paths_json, "main_kcl_paths")

          all_main_files = find_entrypoint_files(repo_root, entrypoint)
          if selected_paths:
              main_files = []
              for path in selected_paths:
                  main_file = repo_root / path
                  if not main_file.is_file():
                      fail(f"main_kcl_paths referenced missing .kcl file: {path}")
                  main_files.append(main_file)
              known_main_files = sorted({*all_main_files, *main_files})
          elif not all_main_files:
              if changed_files_file is not None:
                  assemblies_out.write_text("", encoding="utf-8")
                  snapshots_out.write_text("", encoding="utf-8")
                  return
              fail(f"required entrypoint file was not found: {entrypoint}")
          else:
              known_main_files = all_main_files

          limit_to_selected = bool(selected_paths) or changed_files_file is not None
          if changed_files_file is not None and not selected_paths:
              changed_paths = load_changed_paths(changed_files_file)
              shared_dependency_paths = set()
              if len(PurePosixPath(metadata_path).parts) > 1:
                  shared_dependency_paths.add(metadata_path)
              main_files = main_files_for_changed_paths(
                  repo_root,
                  known_main_files,
                  changed_paths,
                  shared_dependency_paths,
              )
          elif not selected_paths:
              main_files = known_main_files

          assemblies: list[Assembly] = []
          assembly_ids: set[str] = set()
          for main_kcl in main_files:
              parameters_kcl = parameters_file_for_entrypoint(
                  repo_root,
                  main_kcl,
                  parameters_filename,
              )
              metadata_json = metadata_file_for_entrypoint(repo_root, main_kcl, metadata_path)
              if metadata_json is not None:
                  validate_metadata(metadata_json)

              assembly_id = assembly_id_for_main(main_kcl, repo_root)
              if assembly_id in assembly_ids:
                  fail(f"assembly id {assembly_id!r} is not unique")
              assembly_ids.add(assembly_id)
              assemblies.append(
                  Assembly(
                      assembly_id,
                      relative_posix(main_kcl, repo_root),
                      relative_posix(parameters_kcl, repo_root) if parameters_kcl is not None else None,
                      relative_posix(metadata_json, repo_root) if metadata_json is not None else None,
                  )
              )

          snapshot_files = snapshot_files_for_assemblies(
              repo_root,
              main_files,
              known_main_files,
              limit_to_selected,
              parameter_paths_for_assemblies(assemblies, repo_root),
          )

          assemblies_out.write_text(
              "".join(
                  "\t".join(
                      [
                          assembly.id,
                          assembly.main_kcl,
                          assembly_file_field(assembly.parameters_kcl),
                          assembly_file_field(assembly.metadata_json),
                      ]
                  )
                  + "\n"
                  for assembly in assemblies
              ),
              encoding="utf-8",
          )
          snapshots_out.write_text(
              "".join(relative_posix(path, repo_root) + "\n" for path in snapshot_files),
              encoding="utf-8",
          )


      def load_assemblies(assemblies_file: Path) -> list[Assembly]:
          assemblies: list[Assembly] = []
          for line in assemblies_file.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              fields = line.split("\t")
              if len(fields) != 4:
                  fail(f"invalid assemblies file row: {line!r}")
              assemblies.append(
                  Assembly(
                      fields[0],
                      fields[1],
                      optional_assembly_file_field(fields[2]),
                      optional_assembly_file_field(fields[3]),
                  )
              )
          if not assemblies:
              fail("assemblies file did not contain any entrypoint entries")
          return assemblies


      def apply_project_parameters(
          repo_root: Path,
          assemblies_file: Path,
          overrides_json: str,
      ) -> None:
          overrides = load_json_object(overrides_json, "parameters_json")
          if not overrides:
              return

          repo_root = repo_root.resolve()
          assemblies = load_assemblies(assemblies_file)
          names_by_file: dict[Path, set[str]] = {}
          seen: set[str] = set()
          for assembly in assemblies:
              if assembly.parameters_kcl is None:
                  warn(
                      f"assembly {assembly.id} has no parameters file; "
                      "skipping parameter overrides for it"
                  )
                  continue
              parameters_file = repo_root / assembly.parameters_kcl
              names = exported_parameter_names(parameters_file)
              names_by_file[parameters_file] = names
              seen.update(name for name in overrides if name in names)

          missing = sorted(set(overrides) - seen)
          if missing:
              fail(
                  "parameters_json referenced parameter(s) not exported in any "
                  "parameters file: " + ", ".join(missing)
              )

          for parameters_file, names in names_by_file.items():
              selected = {name: value for name, value in overrides.items() if name in names}
              apply_parameter_values(parameters_file, selected)


      def validate_metadata(metadata_file: Path) -> dict[str, Any]:
          if not metadata_file.is_file():
              fail(f"required metadata.json file was not found: {metadata_file}")
          try:
              metadata = json.loads(metadata_file.read_text(encoding="utf-8"))
          except json.JSONDecodeError as err:
              fail(f"metadata.json is not valid JSON: {err}")
          if not isinstance(metadata, dict):
              fail("metadata.json must be a JSON object")

          for field, expected_type in REQUIRED_METADATA.items():
              if field not in metadata:
                  fail(f"metadata.json is missing required field: {field}")
              value = metadata[field]
              if value is None:
                  fail(f"metadata.json field {field} must not be null")
              if field == "material_density":
                  if isinstance(value, bool) or not isinstance(value, expected_type):
                      fail("metadata.json field material_density must be a number")
                  if not math.isfinite(float(value)):
                      fail("metadata.json field material_density must be finite")
              elif not isinstance(value, expected_type):
                  fail(f"metadata.json field {field} must be a string")
              if isinstance(value, str) and value == "":
                  fail(f"metadata.json field {field} must not be empty")
          return metadata


      def write_metadata_env(metadata_file: Path, env_out: Path) -> None:
          metadata = validate_metadata(metadata_file)
          env_out.write_text(
              "".join(
                  f"{env_name}={shlex.quote(str(metadata[field]))}\n"
                  for field, env_name in ENV_NAMES.items()
              ),
              encoding="utf-8",
          )


      def write_bounding_box_json(
          analysis_file: Path,
          output_file: Path,
          output_unit: str,
      ) -> None:
          try:
              analysis = json.loads(analysis_file.read_text(encoding="utf-8"))
          except json.JSONDecodeError as err:
              fail(f"{analysis_file} is not valid JSON: {err}")
          if not isinstance(analysis, dict):
              fail(f"{analysis_file} must contain a JSON object")

          bounding_box = analysis.get("bounding_box")
          if not isinstance(bounding_box, dict):
              fail(f"{analysis_file} is missing object field: bounding_box")
          for field in ("center", "dimensions"):
              value = bounding_box.get(field)
              if not isinstance(value, dict):
                  fail(f"{analysis_file} bounding_box.{field} must be an object")
              for axis in ("x", "y", "z"):
                  coordinate = value.get(axis)
                  if isinstance(coordinate, bool) or not isinstance(coordinate, (int, float)):
                      fail(f"{analysis_file} bounding_box.{field}.{axis} must be a number")

          output = {
              "center": bounding_box["center"],
              "dimensions": bounding_box["dimensions"],
              "output_unit": output_unit,
          }
          output_file.write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )


      def write_source_files(
          repo_root: Path,
          snapshots_file: Path,
          assemblies_file: Path,
          output_dir: Path,
      ) -> None:
          repo_root = repo_root.resolve()
          output_dir = output_dir.resolve()
          relative_paths: set[str] = set()
          for line in snapshots_file.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              relative_path = normalize_repo_path(line, "source file")
              if not relative_path.endswith(".kcl"):
                  continue
              relative_paths.add(relative_path)

          for assembly in load_assemblies(assemblies_file):
              if assembly.parameters_kcl is not None:
                  relative_paths.add(normalize_repo_path(assembly.parameters_kcl, "source file"))
              if assembly.metadata_json is not None:
                  relative_paths.add(normalize_repo_path(assembly.metadata_json, "source file"))

          for relative_path in sorted(relative_paths):
              source = repo_root / relative_path
              if not source.is_file():
                  fail(f"source file does not exist: {relative_path}")
              destination = output_dir / relative_path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)


      def parameters_json_name_for_assemblies(assemblies: list[Assembly]) -> str:
          names = set()
          for assembly in assemblies:
              if assembly.parameters_kcl is None:
                  continue
              path = PurePosixPath(assembly.parameters_kcl)
              if path.suffix != ".kcl":
                  fail(f"assembly parameters_kcl must point to a .kcl file: {assembly.parameters_kcl!r}")
              names.add(path.with_suffix(".json").name)
          if not names:
              fail("parameters_json was supplied, but no selected assembly has a parameters file")
          if len(names) == 1:
              return names.pop()
          return DEFAULT_PARAMETERS_FILENAME.replace(".kcl", ".json")


      def write_manifest(
          artifact_dir: Path,
          assemblies_file: Path,
          zoo_version: str,
          host: str,
          parameters_json: str,
      ) -> None:
          artifact_dir = artifact_dir.resolve()
          loaded_assemblies = load_assemblies(assemblies_file)
          parameters_overrides = load_json_object(parameters_json, "parameters_json")
          parameters_json_name = (
              parameters_json_name_for_assemblies(loaded_assemblies) if parameters_overrides else None
          )
          if parameters_overrides:
              parameters_json_path = artifact_dir / str(parameters_json_name)
              parameters_json_path.write_text(
                  json.dumps(parameters_overrides, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          assemblies = [
              {
                  "id": assembly.id,
                  "main_kcl": assembly.main_kcl,
                  "metadata_json": assembly.metadata_json,
                  "parameters_kcl": assembly.parameters_kcl,
              }
              for assembly in loaded_assemblies
          ]
          files = sorted(
              path.relative_to(artifact_dir).as_posix()
              for path in artifact_dir.rglob("*")
              if path.is_file() and path.name != "manifest.json"
          )
          manifest = {
              "assemblies": assemblies,
              "zoo_version": zoo_version,
              "host": host or None,
              "parameters_json": parameters_json_name if parameters_overrides else None,
              "parameters_override_keys": sorted(parameters_overrides),
              "parameters_overrides": parameters_overrides,
              "artifacts": files,
          }
          (artifact_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )


      def build_parser() -> argparse.ArgumentParser:
          parser = argparse.ArgumentParser(description=__doc__)
          subparsers = parser.add_subparsers(dest="command", required=True)

          apply_parser = subparsers.add_parser("apply-parameters")
          apply_parser.add_argument("--parameters-file", required=True, type=Path)
          apply_parser.add_argument("--overrides-json", required=True)

          apply_project_parser = subparsers.add_parser("apply-project-parameters")
          apply_project_parser.add_argument("--repo-root", required=True, type=Path)
          apply_project_parser.add_argument("--assemblies-file", required=True, type=Path)
          apply_project_parser.add_argument("--overrides-json", required=True)

          info_parser = subparsers.add_parser("project-info")
          info_parser.add_argument("--repo-root", required=True, type=Path)
          info_parser.add_argument("--assemblies-out", required=True, type=Path)
          info_parser.add_argument("--snapshots-out", required=True, type=Path)
          info_parser.add_argument("--main-kcl-paths", default="[]")
          info_parser.add_argument("--changed-files-file", type=Path)
          info_parser.add_argument("--entrypoint", default=DEFAULT_ENTRYPOINT)
          info_parser.add_argument("--parameters-filename", default=DEFAULT_PARAMETERS_FILENAME)
          info_parser.add_argument("--metadata-path", default=DEFAULT_METADATA_PATH)

          metadata_parser = subparsers.add_parser("metadata-env")
          metadata_parser.add_argument("--metadata-file", required=True, type=Path)
          metadata_parser.add_argument("--env-out", required=True, type=Path)

          bounding_box_parser = subparsers.add_parser("bounding-box-json")
          bounding_box_parser.add_argument("--analysis-file", required=True, type=Path)
          bounding_box_parser.add_argument("--output-file", required=True, type=Path)
          bounding_box_parser.add_argument("--output-unit", required=True)

          source_parser = subparsers.add_parser("write-source-files")
          source_parser.add_argument("--repo-root", required=True, type=Path)
          source_parser.add_argument("--snapshots-file", required=True, type=Path)
          source_parser.add_argument("--assemblies-file", required=True, type=Path)
          source_parser.add_argument("--output-dir", required=True, type=Path)

          manifest_parser = subparsers.add_parser("write-manifest")
          manifest_parser.add_argument("--artifact-dir", required=True, type=Path)
          manifest_parser.add_argument("--assemblies-file", required=True, type=Path)
          manifest_parser.add_argument("--zoo-version", required=True)
          manifest_parser.add_argument("--host", default="")
          manifest_parser.add_argument("--parameters-json", required=True)

          return parser


      def main(argv: list[str] | None = None) -> int:
          parser = build_parser()
          args = parser.parse_args(argv)

          try:
              if args.command == "apply-parameters":
                  apply_parameters(args.parameters_file, args.overrides_json)
              elif args.command == "apply-project-parameters":
                  apply_project_parameters(
                      args.repo_root,
                      args.assemblies_file,
                      args.overrides_json,
                  )
              elif args.command == "project-info":
                  write_project_info(
                      args.repo_root,
                      args.assemblies_out,
                      args.snapshots_out,
                      args.main_kcl_paths,
                      args.changed_files_file,
                      args.entrypoint,
                      args.parameters_filename,
                      args.metadata_path,
                  )
              elif args.command == "metadata-env":
                  write_metadata_env(args.metadata_file, args.env_out)
              elif args.command == "bounding-box-json":
                  write_bounding_box_json(
                      args.analysis_file,
                      args.output_file,
                      args.output_unit,
                  )
              elif args.command == "write-source-files":
                  write_source_files(
                      args.repo_root,
                      args.snapshots_file,
                      args.assemblies_file,
                      args.output_dir,
                  )
              elif args.command == "write-manifest":
                  write_manifest(
                      args.artifact_dir,
                      args.assemblies_file,
                      args.zoo_version,
                      args.host,
                      args.parameters_json,
                  )
              else:
                  parser.error(f"unknown command: {args.command}")
          except WorkflowError as err:
              print(f"error: {err}", file=sys.stderr)
              return 1
          return 0


      if __name__ == "__main__":
          raise SystemExit(main())
      KCL_ARTIFACTS_KCL_ARTIFACTS_PY
    - |
      cat > .gitlab-kcl-actions/run-kcl-artifacts.sh <<'KCL_ARTIFACTS_RUN_KCL_ARTIFACTS_SH'
      #!/usr/bin/env bash
      set -Eeuo pipefail

      script_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
      python_helper="${KCL_ARTIFACTS_PY:-${script_dir}/kcl_artifacts.py}"
      repo_root="$(pwd)"
      artifact_dir="${repo_root}/kcl-artifacts"
      parameters_json="${KCL_PARAMETERS_JSON:-}"
      if [[ -z "$parameters_json" ]]; then
        parameters_json="{}"
      fi
      main_kcl_paths="${KCL_MAIN_KCL_PATHS:-}"
      if [[ -z "$main_kcl_paths" ]]; then
        main_kcl_paths="[]"
      fi
      entrypoint="${KCL_ENTRYPOINT:-main.kcl}"
      parameters_filename="${KCL_PARAMETERS_FILENAME:-parameters.kcl}"
      metadata_path="${KCL_METADATA_PATH:-metadata.json}"
      host="${KCL_ZOO_HOST:-}"
      snapshot_angle="${KCL_SNAPSHOT_ANGLE:-four-ways}"
      snapshot_views="${KCL_SNAPSHOT_VIEWS:-iso,front,top,right-side}"
      if [[ -z "$snapshot_views" ]]; then
        snapshot_views="iso,front,top,right-side"
      fi
      camera_style="${KCL_CAMERA_STYLE:-ortho}"
      camera_padding="${KCL_CAMERA_PADDING:-0.1}"
      zoo_attempts="${KCL_ZOO_ATTEMPTS:-4}"
      zoo_retry_delay="${KCL_ZOO_RETRY_DELAY:-10}"
      zoo_parallelism="${KCL_ZOO_PARALLELISM:-6}"
      if ! [[ "$zoo_attempts" =~ ^[1-9][0-9]*$ ]]; then
        echo "error: KCL_ZOO_ATTEMPTS must be a positive integer, got ${zoo_attempts}" >&2
        exit 1
      fi
      if ! [[ "$zoo_retry_delay" =~ ^[0-9]+$ ]]; then
        echo "error: KCL_ZOO_RETRY_DELAY must be a non-negative integer, got ${zoo_retry_delay}" >&2
        exit 1
      fi
      if ! [[ "$zoo_parallelism" =~ ^[1-9][0-9]*$ ]]; then
        echo "error: KCL_ZOO_PARALLELISM must be a positive integer, got ${zoo_parallelism}" >&2
        exit 1
      fi

      tmp_parent="$(mktemp -d)"
      trap 'rm -rf "$tmp_parent"' EXIT
      workspace="${tmp_parent}/repo"
      state_dir="${tmp_parent}/state"
      mkdir -p "$workspace" "$state_dir"
      zoo_semaphore_fifo="$state_dir/zoo-semaphore"
      mkfifo "$zoo_semaphore_fifo"
      exec {zoo_semaphore_fd}<>"$zoo_semaphore_fifo"
      rm -f "$zoo_semaphore_fifo"
      for ((zoo_slot = 0; zoo_slot < zoo_parallelism; zoo_slot += 1)); do
        printf 'slot\n' >&"$zoo_semaphore_fd"
      done

      zero_sha() {
        [[ "$1" =~ ^0+$ ]]
      }

      git_commit_exists() {
        git -C "$repo_root" cat-file -e "${1}^{commit}" >/dev/null 2>&1
      }

      ensure_git_commit() {
        local commit="$1"
        if git_commit_exists "$commit"; then
          return 0
        fi
        git -C "$repo_root" fetch --no-tags --depth=100 origin "$commit" >/dev/null 2>&1 || true
        git_commit_exists "$commit"
      }

      write_changed_files() {
        local output="$1"
        : > "$output"

        if ! command -v git >/dev/null 2>&1; then
          echo "git is not available; no changed KCL assemblies can be selected" >&2
          return 0
        fi
        if ! git -C "$repo_root" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "not in a git worktree; no changed KCL assemblies can be selected" >&2
          return 0
        fi

        local head="${CI_COMMIT_SHA:-HEAD}"
        local base=""
        if [[ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]] && ! zero_sha "$CI_MERGE_REQUEST_DIFF_BASE_SHA"; then
          base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        elif [[ -n "${CI_COMMIT_BEFORE_SHA:-}" ]] && ! zero_sha "$CI_COMMIT_BEFORE_SHA"; then
          base="$CI_COMMIT_BEFORE_SHA"
        fi

        if [[ -n "$base" ]] && ensure_git_commit "$base"; then
          if git -C "$repo_root" diff --name-only --diff-filter=ACMRTD "$base" "$head" > "$output"; then
            return 0
          fi
        fi

        if git -C "$repo_root" rev-parse --verify -q "${head}^{commit}" >/dev/null && \
          git -C "$repo_root" rev-parse --verify -q "${head}^" >/dev/null; then
          git -C "$repo_root" diff-tree --no-commit-id --name-only -r "$head" > "$output"
          return 0
        fi

        git -C "$repo_root" diff --name-only --diff-filter=ACMRTD HEAD -- > "$output" || true
        git -C "$repo_root" diff --name-only --diff-filter=ACMRTD --cached >> "$output" || true
        sort -u -o "$output" "$output"
      }

      changed_files_args=()
      if [[ "$main_kcl_paths" == "[]" ]]; then
        write_changed_files "$state_dir/changed-files.list"
        changed_files_args=(--changed-files-file "$state_dir/changed-files.list")
      fi

      tar \
        --exclude='./.git' \
        --exclude='./.gitlab-kcl-actions' \
        --exclude='./.kcl-tools' \
        --exclude='./kcl-artifacts' \
        -cf - . | tar -C "$workspace" -xf -
      rm -rf "$artifact_dir"
      mkdir -p "$artifact_dir/assemblies" "$artifact_dir/snapshots" "$artifact_dir/source"

      cd "$workspace"

      python3 "$python_helper" project-info \
        --repo-root "$workspace" \
        --assemblies-out "$state_dir/assemblies.tsv" \
        --snapshots-out "$state_dir/snapshots.list" \
        --main-kcl-paths "$main_kcl_paths" \
        --entrypoint "$entrypoint" \
        --parameters-filename "$parameters_filename" \
        --metadata-path "$metadata_path" \
        "${changed_files_args[@]}"

      if [[ ! -s "$state_dir/assemblies.tsv" ]]; then
        echo "No changed KCL assembly directories found; nothing to do."
        exit 0
      fi

      python3 "$python_helper" apply-project-parameters \
        --repo-root "$workspace" \
        --assemblies-file "$state_dir/assemblies.tsv" \
        --overrides-json "$parameters_json"

      : "${ZOO_API_TOKEN:?ZOO_API_TOKEN is required for Zoo CLI artifact generation}"

      zoo_cmd=(zoo)
      if [[ -n "$host" ]]; then
        zoo_cmd+=(--host "$host")
      fi

      zoo_version="$(zoo version)"

      with_zoo_slot() {
        local token
        local status=0

        if ! read -r -u "$zoo_semaphore_fd" token; then
          echo "error: failed to acquire Zoo command slot" >&2
          return 1
        fi

        set +e
        "$@"
        status="$?"
        set -e

        printf 'slot\n' >&"$zoo_semaphore_fd"
        return "$status"
      }

      run_zoo() {
        local attempt=1
        local status=0
        while true; do
          if with_zoo_slot "$@"; then
            return 0
          else
            status="$?"
          fi
          if [ "$attempt" -ge "$zoo_attempts" ]; then
            return "$status"
          fi
          echo >&2 "Zoo command failed with status ${status}; retrying (${attempt}/${zoo_attempts})..."
          sleep "$zoo_retry_delay"
          attempt=$((attempt + 1))
        done
      }

      write_zoo_output() {
        local destination="$1"
        shift
        local tmp
        local attempt=1
        local status=0

        while true; do
          tmp="$(mktemp "${state_dir}/$(basename "$destination").XXXXXX.tmp")"
          if with_zoo_slot "$@" > "$tmp"; then
            mv "$tmp" "$destination"
            return 0
          else
            status="$?"
          fi
          rm -f "$tmp"
          if [ "$attempt" -ge "$zoo_attempts" ]; then
            return "$status"
          fi
          echo >&2 "Zoo command failed with status ${status}; retrying (${attempt}/${zoo_attempts})..."
          sleep "$zoo_retry_delay"
          attempt=$((attempt + 1))
        done
      }

      background_pids=()
      background_names=()

      finish_background_job() {
        local pid="${background_pids[0]}"
        local name="${background_names[0]}"
        local status=0
        local remaining_pid

        background_pids=("${background_pids[@]:1}")
        background_names=("${background_names[@]:1}")

        set +e
        wait "$pid"
        status="$?"
        set -e
        if [[ "$status" -eq 0 ]]; then
          return 0
        fi

        echo "error: background task failed with status ${status}: ${name}" >&2
        for remaining_pid in "${background_pids[@]}"; do
          kill "$remaining_pid" 2>/dev/null || true
        done
        for remaining_pid in "${background_pids[@]}"; do
          wait "$remaining_pid" 2>/dev/null || true
        done
        exit "$status"
      }

      run_background() {
        local name="$1"
        shift

        "$@" &
        background_pids+=("$!")
        background_names+=("$name")

        if [[ "${#background_pids[@]}" -ge "$zoo_parallelism" ]]; then
          finish_background_job
        fi
      }

      wait_for_background_jobs() {
        while [[ "${#background_pids[@]}" -gt 0 ]]; do
          finish_background_job
        done
      }

      wait_for_assembly_command() {
        local pid="$1"
        local name="$2"
        local status=0

        set +e
        wait "$pid"
        status="$?"
        set -e

        if [[ "$status" -ne 0 ]]; then
          echo "error: assembly command failed with status ${status}: ${name}" >&2
        fi
        return "$status"
      }

      record_assembly_command_status() {
        local pid="$1"
        local name="$2"
        local status=0

        if wait_for_assembly_command "$pid" "$name"; then
          return 0
        else
          status="$?"
        fi

        if [[ "$failure_status" -eq 0 ]]; then
          failure_status="$status"
        fi
      }

      snapshot_view_slug() {
        case "$1" in
          iso)
            printf '%s\n' "isometric"
            ;;
          right-side)
            printf '%s\n' "right"
            ;;
          four-ways)
            printf '%s\n' "four-ways"
            ;;
          *)
            printf '%s\n' "$1" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//'
            ;;
        esac
      }

      export_one() {
        local format="$1"
        local extension="$2"
        local main_kcl="$3"
        local export_dir="$4"
        local destination="$5"
        local exported_count=0
        local exported_file=""
        local candidate

        mkdir -p "$export_dir"
        run_zoo "${zoo_cmd[@]}" kcl export \
          --deterministic \
          --output-format "$format" \
          "$main_kcl" \
          "$export_dir"

        while IFS= read -r candidate; do
          exported_count=$((exported_count + 1))
          exported_file="$candidate"
        done < <(find "$export_dir" -type f -name "*.${extension}" | sort)
        if [[ "$exported_count" -ne 1 ]]; then
          echo "error: expected one ${extension} export, found ${exported_count}" >&2
          exit 1
        fi
        mv "$exported_file" "$destination"
      }

      write_analysis() {
        local destination="$1"
        local main_kcl="$2"
        local center_of_mass_output_unit="$3"

        write_zoo_output "$destination" \
          "${zoo_cmd[@]}" kcl analyze \
          --format json \
          --material-density "$MATERIAL_DENSITY" \
          --material-density-unit "$MATERIAL_DENSITY_UNIT" \
          --mass-output-unit "$MASS_OUTPUT_UNIT" \
          --volume-output-unit "$VOLUME_OUTPUT_UNIT" \
          --density-output-unit "$DENSITY_OUTPUT_UNIT" \
          --surface-area-output-unit "$SURFACE_AREA_OUTPUT_UNIT" \
          --center-of-mass-output-unit "$center_of_mass_output_unit" \
          "$main_kcl"
      }

      process_assembly() {
        local assembly_index="$1"
        local assembly_id="$2"
        local main_kcl="$3"
        local metadata_json="$4"
        local assembly_dir="$artifact_dir/assemblies/$assembly_id"
        local metadata_env=""
        local analysis_file=""
        local bounding_box_analysis_file=""
        local entrypoint_filename
        local entrypoint_stem
        local lint_pid
        local analysis_pid=""
        local bounding_box_analysis_pid=""
        local step_pid
        local gltf_pid
        local snapshot_pid
        local failure_status=0

        mkdir -p "$assembly_dir"

        entrypoint_filename="${main_kcl##*/}"
        entrypoint_stem="${entrypoint_filename%.kcl}"

        if [[ "$metadata_json" == "-" ]]; then
          echo "warning: no metadata JSON for ${main_kcl}; skipping physics artifacts" >&2
        else
          metadata_env="${state_dir}/metadata-${assembly_index}.env"
          python3 "$python_helper" metadata-env \
            --metadata-file "$metadata_json" \
            --env-out "$metadata_env"

          # shellcheck disable=SC1090
          source "$metadata_env"
        fi

        run_zoo "${zoo_cmd[@]}" kcl lint "$main_kcl" &
        lint_pid="$!"

        if [[ "$metadata_json" != "-" ]]; then
          analysis_file="$assembly_dir/${entrypoint_stem}-analysis.json"
          write_analysis "$analysis_file" "$main_kcl" "$CENTER_OF_MASS_OUTPUT_UNIT" &
          analysis_pid="$!"

          bounding_box_analysis_file="$analysis_file"
          if [[ "$BOUNDING_BOX_OUTPUT_UNIT" != "$CENTER_OF_MASS_OUTPUT_UNIT" ]]; then
            bounding_box_analysis_file="${state_dir}/bounding-box-analysis-${assembly_index}.json"
            write_analysis "$bounding_box_analysis_file" "$main_kcl" "$BOUNDING_BOX_OUTPUT_UNIT" &
            bounding_box_analysis_pid="$!"
          fi
        fi

        export_one \
          step \
          step \
          "$main_kcl" \
          "$state_dir/export-step-${assembly_index}" \
          "$assembly_dir/${entrypoint_stem}.step" &
        step_pid="$!"

        export_one \
          gltf \
          gltf \
          "$main_kcl" \
          "$state_dir/export-gltf-${assembly_index}" \
          "$assembly_dir/${entrypoint_stem}.gltf" &
        gltf_pid="$!"

        run_zoo "${zoo_cmd[@]}" kcl snapshot \
          --output-format png \
          --angle "$snapshot_angle" \
          --camera-style "$camera_style" \
          --camera-padding "$camera_padding" \
          "$main_kcl" \
          "$assembly_dir/${entrypoint_stem}-snapshot.png" &
        snapshot_pid="$!"

        record_assembly_command_status "$lint_pid" "lint ${main_kcl}"
        if [[ -n "$analysis_pid" ]]; then
          record_assembly_command_status "$analysis_pid" "analysis ${main_kcl}"
        fi
        if [[ -n "$bounding_box_analysis_pid" ]]; then
          record_assembly_command_status \
            "$bounding_box_analysis_pid" \
            "bounding-box analysis ${main_kcl}"
        fi
        record_assembly_command_status "$step_pid" "STEP export ${main_kcl}"
        record_assembly_command_status "$gltf_pid" "glTF export ${main_kcl}"
        record_assembly_command_status "$snapshot_pid" "snapshot ${main_kcl}"

        if [[ "$failure_status" -ne 0 ]]; then
          return "$failure_status"
        fi

        if [[ "$metadata_json" != "-" ]]; then
          python3 "$python_helper" bounding-box-json \
            --analysis-file "$bounding_box_analysis_file" \
            --output-file "$assembly_dir/${entrypoint_stem}-bounding-box.json" \
            --output-unit "$BOUNDING_BOX_OUTPUT_UNIT"
        fi
      }

      assembly_index=0
      while IFS=$'\t' read -r assembly_id main_kcl _parameters_kcl metadata_json; do
        [ -n "$assembly_id" ] || continue
        assembly_index=$((assembly_index + 1))
        run_background \
          "assembly ${assembly_id}" \
          process_assembly "$assembly_index" "$assembly_id" "$main_kcl" "$metadata_json"
      done < "$state_dir/assemblies.tsv"
      wait_for_background_jobs

      write_snapshot_view() {
        local snapshot_input="$1"
        local snapshot_view_angle="$2"
        local snapshot_base="$artifact_dir/snapshots/${snapshot_input%.kcl}"
        local snapshot_slug
        local snapshot_output

        snapshot_slug="$(snapshot_view_slug "$snapshot_view_angle")"
        snapshot_output="${snapshot_base}.${snapshot_slug}.png"
        mkdir -p "$(dirname "$snapshot_output")"
        run_zoo "${zoo_cmd[@]}" kcl snapshot \
          --output-format png \
          --angle "$snapshot_view_angle" \
          --camera-style "$camera_style" \
          --camera-padding "$camera_padding" \
          "$snapshot_input" \
          "$snapshot_output"
      }

      IFS=',' read -r -a snapshot_view_angles <<< "$snapshot_views"
      while IFS= read -r snapshot_input; do
        [[ -n "$snapshot_input" ]] || continue
        for snapshot_view_angle in "${snapshot_view_angles[@]}"; do
          snapshot_view_angle="${snapshot_view_angle//[[:space:]]/}"
          [[ -n "$snapshot_view_angle" ]] || continue
          run_background \
            "snapshot ${snapshot_input} ${snapshot_view_angle}" \
            write_snapshot_view "$snapshot_input" "$snapshot_view_angle"
        done
      done < "$state_dir/snapshots.list"
      wait_for_background_jobs

      python3 "$python_helper" write-source-files \
        --repo-root "$workspace" \
        --snapshots-file "$state_dir/snapshots.list" \
        --assemblies-file "$state_dir/assemblies.tsv" \
        --output-dir "$artifact_dir/source"

      python3 "$python_helper" write-manifest \
        --artifact-dir "$artifact_dir" \
        --assemblies-file "$state_dir/assemblies.tsv" \
        --zoo-version "$zoo_version" \
        --host "$host" \
        --parameters-json "$parameters_json"
      KCL_ARTIFACTS_RUN_KCL_ARTIFACTS_SH
    - chmod +x .gitlab-kcl-actions/run-kcl-artifacts.sh
    - export PATH="$CI_PROJECT_DIR/.kcl-tools/bin:$PATH"
  script:
    - export PATH="$CI_PROJECT_DIR/.kcl-tools/bin:$PATH"
    - KCL_ARTIFACTS_PY="$CI_PROJECT_DIR/.gitlab-kcl-actions/kcl_artifacts.py" .gitlab-kcl-actions/run-kcl-artifacts.sh
  artifacts:
    when: always
    paths:
      - kcl-artifacts/
