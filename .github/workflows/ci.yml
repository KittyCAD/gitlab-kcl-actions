name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Sync Python dependencies
        run: just ci-sync

      - name: Python lint
        run: just lint

      - name: Python tests
        run: just test

      - name: Shell syntax
        run: just shell

      - name: Component template is generated
        run: just generated

  kcl-artifact-workflow:
    runs-on: ubuntu-latest
    env:
      ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Sync Python dependencies
        run: just ci-sync

      - name: Require Zoo token
        run: |
          if [[ -z "${ZOO_API_TOKEN:-}" ]]; then
            echo "::error::ZOO_API_TOKEN is required because the real Zoo smoke test is mandatory"
            exit 1
          fi

      - name: Install Zoo CLI
        run: |
          scripts/install-zoo-cli.sh "" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run KCL artifact workflow test
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          just kcl-artifact-workflow
