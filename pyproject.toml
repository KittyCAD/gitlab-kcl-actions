[project]
name = "gitlab-kcl-actions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["kittycad>=1.3.8"]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "ty>=0.0.35",
]

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["scripts", "tests"]
